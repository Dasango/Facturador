spring.application.name=backend
server.port=8080

# --- Base de Datos (PostgreSQL) ---
# En Render, asegúrate de que DB_URL termine en :6543/postgres?sslmode=require
spring.datasource.url=dbc:postgresql://db.zfykeqtjsixasglxyaay.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pepeELMAGOveloz1234
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# Aumentamos el tiempo de espera a 60s para dar margen a la red de Render
spring.datasource.hikari.connection-timeout=60000
# Mantiene la conexión activa para evitar que Render la cierre por inactividad
spring.datasource.hikari.keepalive-time=30000

# --- JPA / Hibernate ---
# Importante: 'none' evita errores de DDL si la red es lenta al arrancar
spring.jpa.hibernate.ddl-auto=none
# Evita que Hibernate intente validar la estructura de tablas cada vez
spring.jpa.generate-ddl=false
# Fuerza el dialecto para ahorrar tiempo de detección automática
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Evita que la app falle si la base de datos tarda un poco en responder al inicio
spring.datasource.hikari.initialization-fail-timeout=0
# Desactiva la búsqueda de metadatos JDBC que causa el error de Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- Logs y Formato ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

