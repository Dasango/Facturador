spring.application.name=backend
server.port=8080

# --- Base de Datos (PostgreSQL) ---
# En Render (Produccion), configuraremos las variables de entorno.
# Localmente usa los valores por defecto definidos despues de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:postgresql://pool-tcp-use11-da9ecc1-987013f2061f655b.elb.us-east-1.amazonaws.com:6543/postgres}
spring.datasource.username=${DB_USER:postgres.zfykeqtjsixasglxyaay}
spring.datasource.password=${DB_PASSWORD:pepeELMAGOveloz1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.ssl=true
spring.datasource.hikari.sslmode=require

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- Logs y Formato ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

