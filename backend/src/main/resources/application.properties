spring.application.name=backend
server.port=8080

# --- Base de Datos (Nombres Estándar para la Nube) ---
# Al usar estos nombres, Spring Boot los busca automáticamente en Environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# Tiempo de espera de 60s para evitar el error de Timeout que tenías
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=30000

# --- JPA / Hibernate ---
# 'none' es vital para que no intente crear tablas antes de conectar
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Esto evita que la app se apague si falla la primera conexión
spring.datasource.hikari.initialization-fail-timeout=0
# Desactiva metadatos JDBC para saltar el error de red al arrancar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- Logs y Formato ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Supabase Configuration ---
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
