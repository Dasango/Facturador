<div id="modalEdit" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="text-h2">Editar Producto</h2>
            <button class="modal-close-btn" onclick="closeModal('modalEdit')">&times;</button>
        </div>

        <div class="modal-body">
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="component-row" style="gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Cód. Principal</label>
                        <input type="text" id="editCodigoP" class="input-control">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Cód. Auxiliar</label>
                        <input type="text" id="editCodigoA" class="input-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="editNombre" class="input-control">
                </div>

                <div class="component-row" style="gap: 15px; margin-bottom: 0;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Precio ($)</label>
                        <input type="number" step="0.01" id="editPrecio" class="input-control">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">IVA</label>
                        <select id="editIva" class="input-control">
                            <option value="15%">15%</option>
                            <option value="0%">0%</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('modalEdit')">Cancelar</button>
            <button class="btn btn-primary" onclick="saveProduct()">Guardar Cambios</button>
        </div>
    </div>
</div>

<div id="modalDelete" class="modal-overlay">
    <div class="modal-container" style="max-width: 400px;">
        <div class="modal-header">
            <h2 class="text-h2" style="color: #dc3545;">Eliminar Producto</h2>
        </div>
        <div class="modal-body">
            <p class="text-body">¿Estás seguro de que deseas eliminar este producto? Esta acción no se puede deshacer.
            </p>
            <input type="hidden" id="deleteId">
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('modalDelete')">Cancelar</button>
            <button class="btn btn-primary" style="background-color: #dc3545; border-color: #dc3545;"
                onclick="confirmDelete()">Eliminar</button>
        </div>
    </div>
</div>

<div id="modalSelectProduct" class="modal-overlay">
    <div class="modal-container" style="max-width: 600px; height: 80vh; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h2 class="text-h2">Seleccionar Producto</h2>
            <button class="modal-close-btn"
                onclick="document.getElementById('modalSelectProduct').classList.remove('open')">&times;</button>
        </div>

        <div class="modal-body" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
            <div style="margin-bottom: 15px;">
                <input type="text" id="searchProductInput" class="input-control"
                    placeholder="🔍 Buscar por nombre o código...">
            </div>

            <div style="flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px;">
                <table class="table" style="width: 100%;">
                    <thead style="position: sticky; top: 0; background: white; z-index: 1;">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th style="text-align: center;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="modalProductsBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary"
                onclick="document.getElementById('modalSelectProduct').classList.remove('open')">Cerrar</button>
        </div>
    </div>
</div>
