<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facto - Regístrate</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/pages/signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .form-step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .step-indicator {
            margin-bottom: 25px;
            font-size: 0.95em;
            color: #555;
            font-weight: 600;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        /* Estilo inputs file */
        input[type="file"] {
            padding: 10px;
            background: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            color: #555;
        }

        input[type="file"]::file-selector-button {
            margin-right: 15px;
            border: none;
            background: #000;
            padding: 8px 12px;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        input[type="file"]::file-selector-button:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <header
        style="position: sticky; top: 0; z-index: 1000; background-color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; margin: 0 auto; border-bottom: 1px solid #eee;">
        <a href="../index.html" class="logo" style="text-decoration: none; color: inherit; display: block;">
            <h1 style="font-size: 32px; font-weight: 900; margin: 0;">Facto<span
                    style="color: #666; font-size: 14px; margin-left: 10px; font-weight: 500;">Servicios</span></h1>
        </a>
        <nav class="nav-menu">
            <a href="../index.html" style="text-decoration: none; color: black; font-weight: 500;">Regresar</a>
        </nav>
    </header>

    <div class="signup-container">
        <div class="signup-content">
            <main class="signup-main">
                <h2 class="signup-title">Crear Cuenta</h2>
                <p class="signup-subtitle" id="stepIndicator">Paso 1 de 3: Identificación</p>

                <form class="signup-form" id="signupForm">

                    <div class="form-step active" id="step1">
                        <div class="form-group">
                            <label class="form-label">Número de RUC *</label>
                            <input type="text" name="ruc" id="ruc" class="input-control" placeholder="1710000000001"
                                required maxlength="13">
                        </div>

                        <div style="display: flex; gap: 15px;">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Nombres *</label>
                                <input type="text" name="nombres" class="input-control" placeholder="Juan Andrés"
                                    required>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Apellidos *</label>
                                <input type="text" name="apellidos" class="input-control" placeholder="Pérez López"
                                    required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Correo Electrónico *</label>
                            <input type="email" name="email" class="input-control" placeholder="nombre@email.com"
                                required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" name="password" id="password" class="input-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirmar Contraseña *</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="input-control"
                                required>
                        </div>

                        <button type="button" class="btn btn-primary btn-block" onclick="nextStep(2)">Siguiente:
                            Dirección</button>
                    </div>

                    <div class="form-step" id="step2">
                        <h3 style="font-size: 18px; margin-bottom: 15px; font-weight: 600;">Dirección Matriz</h3>

                        <div class="form-group">
                            <label class="form-label">Calle Principal *</label>
                            <input type="text" name="calle_principal" class="input-control"
                                placeholder="Ej. Av. Amazonas" required>
                        </div>

                        <div style="display: flex; gap: 15px;">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Número *</label>
                                <input type="text" name="numero_casa" class="input-control" placeholder="Ej. N45-23"
                                    required>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Intersección *</label>
                                <input type="text" name="interseccion" class="input-control"
                                    placeholder="Ej. Calle La Niña" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Barrio / Sector (Opcional)</label>
                            <input type="text" name="barrio" class="input-control" placeholder="Ej. La Mariscal">
                        </div>

                        <button type="button" class="btn btn-primary btn-block" onclick="nextStep(3)">Siguiente:
                            Archivos</button>
                        <button type="button" class="btn btn-secondary btn-block" onclick="prevStep(1)">Atrás</button>
                    </div>

                    <div class="form-step" id="step3">
                        <h3 style="font-size: 18px; margin-bottom: 15px; font-weight: 600;">Configuración Final</h3>

                        <div class="form-group">
                            <label class="form-label">Firma Electrónica (.p12) *</label>
                            <input type="file" name="firma_archivo" id="firma_archivo" accept=".p12">
                            <small style="color: #777;">Tu firma es necesaria para validar los documentos ante el
                                SRI.</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Logo (Opcional)</label>
                            <input type="file" name="logo_archivo" id="logo_archivo" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Crear
                            Cuenta</button>
                        <button type="button" class="btn btn-secondary btn-block" onclick="prevStep(2)">Atrás</button>
                    </div>

                </form>
            </main>
        </div>

        <div class="signup-image">
            <img src="../assets/images/FactoCuaderno.png" alt="Signup Art">
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="../assets/js/signup.js"></script>
</body>

</html>
