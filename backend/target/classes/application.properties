spring.application.name=backend
server.port=8080

# --- Base de Datos (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# Dale más tiempo a la red de Render para conectar (60 segundos)
spring.datasource.hikari.connection-timeout=60000

# --- JPA / Hibernate ---
# Se cambió a 'none' para evitar bloqueos de red en el despliegue de Render
spring.jpa.hibernate.ddl-auto=none
# Fuerza a Hibernate a saber que hablas con Postgres sin preguntar a la red
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Evita que la app muera si la base de datos tarda en responder
spring.datasource.hikari.initialization-fail-timeout=0

# Muestra las consultas SQL en consola
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible (no una sola línea larga)
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
# Desactiva Open Session In View para evitar consultas lentas ocultas en la vista
spring.jpa.open-in-view=false

# Asegura que los nombres de tablas/columnas usen snake_case en la BD (ej: miCampo -> mi_campo)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
