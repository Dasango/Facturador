spring.application.name=backend
server.port=8080

# --- Base de Datos (PostgreSQL) ---
# Se recomienda usar variables de entorno para evitar hardcoding de credenciales
spring.datasource.url=${DB_URL:jdbc:postgresql://pool-tcp-use11-da9ecc1-987013f2061f655b.elb.us-east-1.amazonaws.com:6543/postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=30000

# Configuración SSL para conexiones seguras (Necesario para Supabase/Render)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- Logs y Formato ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Supabase Configuration ---
supabase.url=${SUPABASE_URL:https://zfykeqtjsixasglxyaay.supabase.co}
supabase.key=${SUPABASE_KEY}

# --- Configuración de Correo Electrónico ---
# Configuración necesaria para que JavaMailSender no sea null
# Configuración usando variables de entorno
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Propiedades adicionales
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
