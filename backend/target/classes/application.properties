spring.application.name=backend
server.port=8080

# --- Base de Datos (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración del Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# --- JPA / Hibernate ---
# 'update' crea/modifica tablas automáticamente según tus entidades. 
# Úsalo en desarrollo. En producción usa 'validate' o 'none'.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en consola
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible (no una sola línea larga)
spring.jpa.properties.hibernate.format_sql=true

# --- Buenas Prácticas ---
# Desactiva Open Session In View para evitar consultas lentas ocultas en la vista
spring.jpa.open-in-view=false

# Asegura que los nombres de tablas/columnas usen snake_case en la BD (ej: miCampo -> mi_campo)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
